services:
  # Jenkins Service
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins
    restart: always
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=UTC

  # Atlantis Service (Terraform Pull Request Automation)
  atlantis:
    image: runatlantis/atlantis:latest
    container_name: atlantis
    restart: always
    ports:
      - "4141:4141"
    environment:
      # URL Atlantis is reachable at (e.g. http://<VM_IP>:4141 or domain/tunnel)
      - ATLANTIS_ATLANTIS_URL=${ATLANTIS_URL:-http://localhost:4141}
      # Git Provider configuration (GitHub example)
      - ATLANTIS_GH_USER=${ATLANTIS_GH_USER:-your-github-username}
      - ATLANTIS_GH_TOKEN=${ATLANTIS_GH_TOKEN:-your-github-token}
      - ATLANTIS_GH_WEBHOOK_SECRET=${ATLANTIS_GH_WEBHOOK_SECRET:-your-webhook-secret}
      # Allowed repos (e.g. github.com/your-org/*)
      - ATLANTIS_REPO_ALLOWLIST=${ATLANTIS_REPO_ALLOWLIST:-github.com/*}
    volumes:
      - atlantis_data:/atlantis
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_data:
  atlantis_data:
